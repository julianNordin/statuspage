name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref. A second push while the first is still going cancels it: the older result
# is about to be irrelevant and the runners are not free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  dotnet:
    name: .NET — build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # The analyzers run as part of the build and TreatWarningsAsErrors is on, so this is
      # the lint step as well. There is no separate one to forget to add.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Testcontainers starts SQL Server and Azurite. The runner has a Docker daemon, which
      # is the whole reason these tiers can run here rather than only on a workstation.
      - name: Test
        run: dotnet test --no-build --configuration Release

  angular:
    name: Angular — lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Build
        run: npm run build

  e2e:
    name: Browser — journeys and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            e2e/package-lock.json

      - name: Start the stack
        run: docker compose up -d --build

      - name: Install the client
        working-directory: client
        run: npm ci

      - name: Install the suite
        working-directory: e2e
        run: npm ci

      - name: Install the browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # The API has to be answering before the suite starts. The compose file has no
      # healthcheck on it, deliberately — the runtime image has no curl — so the wait
      # happens here, where curl exists.
      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5080/health > /dev/null; then
              echo "API is answering"
              exit 0
            fi
            sleep 2
          done
          echo "API never came up"
          docker compose logs --tail 50
          exit 1

      - name: Run the browser suite
        working-directory: e2e
        run: npx playwright test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 200

  images:
    name: Images — publish to GHCR
    runs-on: ubuntu-latest
    needs: [dotnet, angular, e2e]
    # Only from main, and never from a pull request. A fork's PR must not be able to publish
    # under this repository's name.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: src/StatusPage.Api/Dockerfile
          - name: checker
            dockerfile: src/StatusPage.Checker/Dockerfile
          - name: migrate
            dockerfile: src/StatusPage.Infrastructure/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
