<div class="wrap">
  <form class="card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1 class="title">Operator sign in</h1>

    @if (failed()) {
      <p class="error" role="alert">
        Those credentials were not accepted.
      </p>
    }

    <label class="field">
      <span class="field__label">Email</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="invalid('email') || null"
        required />
      @if (invalid('email')) {
        <span class="field__error">Enter the address you sign in with.</span>
      }
    </label>

    <label class="field">
      <span class="field__label">Password</span>
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="invalid('password') || null"
        required />
      @if (invalid('password')) {
        <span class="field__error">Enter your password.</span>
      }
    </label>

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="aside">
      There is no sign-up. Operator accounts are created by a deployment, which is the right
      amount of friction for the people allowed to declare an outage.
    </p>

    <p class="back"><a routerLink="/">Back to the status page</a></p>
  </form>
</div>
